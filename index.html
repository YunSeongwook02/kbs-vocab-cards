<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>KBS 어휘 카드</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="어휘 카드">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* Layout: one narrow study column — mode switch on top, one card or one question at a time, controls in thumb reach */
:root{
  --paper:#f6f7f9; --surface:#ffffff; --ink:#1b2130; --muted:#5d6577; --line:#dfe3ea;
  --indigo:#2f3f8f; --indigo-soft:#e7eaf7; --ok:#1f7a4d; --ok-soft:#e3f3ea; --bad:#b3362c; --bad-soft:#fae6e3;
  --display:"Gowun Batang","Noto Serif KR","AppleMyungjo",serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --shadow:0 1px 2px rgba(20,30,60,.06),0 8px 24px rgba(20,30,60,.07);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#11141c; --surface:#1a1f2b; --ink:#e7e9f0; --muted:#9aa2b5; --line:#2b3242;
  --indigo:#9fb0ff; --indigo-soft:#232b4a; --ok:#6fd3a0; --ok-soft:#173a2a; --bad:#ff9a8f; --bad-soft:#3d1f1c;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#11141c; --surface:#1a1f2b; --ink:#e7e9f0; --muted:#9aa2b5; --line:#2b3242;
  --indigo:#9fb0ff; --indigo-soft:#232b4a; --ok:#6fd3a0; --ok-soft:#173a2a; --bad:#ff9a8f; --bad-soft:#3d1f1c;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--paper)}
body{color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:18px 40px;display:flex;flex-direction:column;gap:16px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-size:22px;font-weight:700;margin:0;letter-spacing:-.01em}
.count{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;color:var(--muted);font:600 14px var(--body);padding:10px 8px;border-radius:9px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--indigo);color:var(--surface)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:500 13px var(--body);padding:6px 12px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--indigo);background:var(--indigo-soft);color:var(--indigo)}
.label{font-size:11px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
button:focus-visible,.card:focus-visible{outline:2px solid var(--indigo);outline-offset:2px}
.bar{height:4px;background:var(--line);border-radius:4px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--indigo);width:0;transition:width .25s}

/* flip card */
.stage{perspective:1200px}
.card{position:relative;width:100%;min-height:300px;cursor:pointer;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.2,.7,.2,1);border-radius:18px}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:22px 20px;display:flex;flex-direction:column;gap:10px}
.back{transform:rotateY(180deg)}
.face .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tag{font-size:12px;font-weight:600;color:var(--indigo);background:var(--indigo-soft);padding:2px 10px;border-radius:999px}
.side{font-size:12px;color:var(--muted)}
.face .main{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:6px;min-width:0}
.word{font-family:var(--display);font-size:clamp(30px,9vw,42px);font-weight:700;line-height:1.2;word-break:keep-all;text-wrap:balance}
.hanja{font-family:var(--display);font-size:18px;color:var(--muted);letter-spacing:.06em}
.def{font-size:17px;line-height:1.7;word-break:keep-all;text-wrap:pretty;max-width:34em}
.def p{margin:0}
.def p+p{margin-top:6px}
.hint{font-size:12px;color:var(--muted);text-align:center}
.ex{font-size:13px;color:var(--muted);border-top:1px dashed var(--line);padding-top:10px;word-break:keep-all}
.ex b{color:var(--ink);font-weight:600}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 15px var(--body);padding:14px 10px;border-radius:12px;cursor:pointer}
.btn.primary{background:var(--indigo);border-color:var(--indigo);color:var(--surface)}
.btn.no{color:var(--bad)}
.btn.yes{color:var(--ok)}
.btn:disabled{opacity:.45;cursor:default}
.ghost{border:0;background:none;color:var(--indigo);font:500 13px var(--body);cursor:pointer;padding:6px 2px}
.tally{display:flex;gap:14px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.tally b{color:var(--ink)}

/* blank quiz */
.q{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:20px;display:flex;flex-direction:column;gap:14px}
.stem{font-size:13px;color:var(--muted)}
.sent{font-family:var(--display);font-size:19px;line-height:1.85;word-break:keep-all}
.blank{display:inline-block;min-width:4.2em;border-bottom:2px solid var(--indigo);text-align:center;color:var(--indigo);font-weight:700;padding:0 4px;line-height:1.3}
.blank.ok{color:var(--ok);border-color:var(--ok)}
.blank.bad{color:var(--bad);border-color:var(--bad)}
.src{font-size:12px;color:var(--muted)}
.opts{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.opt{width:100%;display:flex;gap:12px;align-items:baseline;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:500 16px var(--body);padding:12px 14px;border-radius:12px;cursor:pointer}
.opt .n{font-family:var(--display);color:var(--muted);flex:none}
.opt .h{font-size:13px;color:var(--muted);margin-left:2px}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.explain{border-radius:12px;background:var(--paper);padding:12px 14px;font-size:14px;display:flex;flex-direction:column;gap:4px}
.explain .w{font-family:var(--display);font-weight:700;font-size:16px}
.verdict{font-weight:600}
.verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)}
.done{text-align:center;padding:28px 16px}
.done .big{font-family:var(--display);font-size:40px;font-weight:700;font-variant-numeric:tabular-nums}
footer{font-size:12px;color:var(--muted);line-height:1.6}
@media (prefers-reduced-motion: reduce){.card{transition:none}.bar>i{transition:none}}
</style>

</head>
<body>
<div class="wrap">
  <header>
    <h1>KBS 어휘 카드</h1>
    <span class="count" id="count"></span>
  </header>

  <div class="seg" role="group" aria-label="학습 방식">
    <button id="tabFlip" aria-pressed="true">플립카드</button>
    <button id="tabQuiz" aria-pressed="false">예문 빈칸 문제</button>
  </div>

  <!-- FLIP -->
  <section id="flip" class="row" style="flex-direction:column;align-items:stretch;gap:14px">
    <div class="row" role="group" aria-label="카드 방향">
      <button class="chip" id="dirWord" aria-pressed="true">단어 → 뜻</button>
      <button class="chip" id="dirDef" aria-pressed="false">뜻 → 단어</button>
    </div>
    <div class="row" role="group" aria-label="분류" id="tagRow"></div>
    <div class="bar" aria-hidden="true"><i id="flipBar"></i></div>
    <div class="row" style="justify-content:space-between">
      <div class="tally"><span>진행 <b id="fPos">0</b>/<b id="fTot">0</b></span><span>알아요 <b id="fKnow">0</b></span><span>다시 <b id="fAgain">0</b></span></div>
      <button class="ghost" id="reshuffle">새로 섞기</button>
    </div>
    <div class="stage" id="stage">
      <div class="card" id="card" tabindex="0" role="button" aria-label="카드 뒤집기">
        <div class="face front" id="front"></div>
        <div class="face back" id="back"></div>
      </div>
    </div>
    <div class="actions">
      <button class="btn no" id="again">몰라요 · 다시</button>
      <button class="btn yes" id="know">알아요</button>
    </div>
    <p class="hint">카드를 눌러 뒤집기 · "몰라요"를 누른 카드는 이번 회차 뒤쪽에 다시 나옵니다</p>
  </section>

  <!-- QUIZ -->
  <section id="quiz" hidden style="display:flex;flex-direction:column;gap:14px">
    <div class="row" role="group" aria-label="분류" id="qTagRow"></div>
    <div class="bar" aria-hidden="true"><i id="quizBar"></i></div>
    <div class="row" style="justify-content:space-between">
      <div class="tally"><span>문항 <b id="qPos">0</b>/<b id="qTot">0</b></span><span>정답 <b id="qOk">0</b></span><span>오답 <b id="qBad">0</b></span></div>
      <button class="ghost" id="qRestart">새로 섞기</button>
    </div>
    <div id="qBox"></div>
  </section>

  <footer>
    빈칸 문제의 예문은 국립국어원 『표준국어대사전』에 실린 해당 뜻의 용례만 사용했습니다. 사전에 용례가 없는 단어는 빈칸 문제에서 빠지고 플립카드에만 나옵니다. 순서는 시작할 때마다 무작위로 섞입니다.
  </footer>
</div>

const EX = {"0": ["한 사람이 【가래를】 잡고, 두 사람 내지 네 사람이 각기 【가래에】 달린 끈을 잡아당겨 가래질을 한다."], "1": ["작은 다랑이는 그나마 쟁기를 댈 수가 없어 【따비로】 이겨야 했다. ≪송기숙, 녹두 장군≫", "쟁기를 쓸 줄 몰라 【따비로】 밭을 갈고, 돛배를 만들 줄 몰라 삼나무 뗏목을 타고…. ≪현기영, 변방에 우짖는 새≫"], "2": ["소에게 【써레를】 지우다.", "힘겹게 【써레를】 끌던 소가 문득 논 한가운데서 우뚝 버티고 섰다."], "3": ["【고무래로】 밭의 흙을 고르게 만들다.", "반쯤 불에 탄 【고무래가】 있어서 우리는 이것으로 산처럼 재를 긁어모으다가 흔히 깜장이가 되곤 했다. ≪윤흥길, 황혼의 집≫"], "4": ["뒷전에서 하는 그런 말을 들을 때면 보리타작을 하던 【도리깨를】 들어 그자의 상판을 갈기고 싶었다. ≪한수산, 유민≫", "【도리깨를】 치다.", "【도리깨를】 휘두르다."], "5": ["【할당을】 받다."], "6": ["독일은 나치 【청산을】 위해서 특별 법안을 만들었다.", "새 대통령은 부패 【청산과】 경제 개발을 약속했다.", "몇몇 사람이 감옥을 가거나 여론 재판에서 난도질된 걸로 【청산은】 끝나고 우리 주위에는 죄 없고 잘난 사람들만 남게 되었다. ≪이문열, 시대와의 불화≫", "봉건 잔재의 【청산】."], "7": ["너에게 소작을 얻으러 왔다든지 돈을 취하러 왔다든지 그러한 등의 【청구를】 하러 온 것은 아니다. ≪한용운, 흑풍≫"], "8": ["선수들이 어려운 묘기를 할 때마다 관중석에서 우레와 같은 【갈채가】 쏟아졌다.", "김범우는 강원봉 선생의 그 속 후련한 행동에 【갈채를】 보냈다. ≪조정래, 태백산맥≫", "【갈채를】 받다."], "9": ["왜인들은 태연하게 으쓱이며 갯가뿐만 아니라 여항의 고샅까지 들어와 【활보를】 했다. ≪유현종, 들불≫"], "10": ["【한몫씩】 챙기다.", "【한몫】 떼어 주다."], "11": ["동생은 【귓불에】 구멍을 두 개나 뚫고 귀걸이를 했다.", "뜨거운 주전자를 만진 형이 재빨리 【귓불을】 잡았다."], "12": ["차고 지르고 【드잡이를】 쳐서 코가 터지고 갓양태가 떨어진 이 비장과 배 비장은…. ≪박종화, 임진왜란≫", "하루가 멀다고 집안 어른들이 큰당숙 집에 모여 【드잡이】 직전에까지 이르는 격렬한 말다툼을 벌이곤 했다. ≪윤흥길, 무지개는 언제 뜨는가≫", "【드잡이】 싸움."], "13": ["이제 막 【봉오리가】 맺을락 말락 하는 할미꽃…. ≪김원일, 불의 제전≫", "개울가 바위틈에 철쭉은 터질 듯 【봉오리를】 물고 있었다. ≪박경리, 토지≫", "【봉오리가】 맺히다."], "14": ["【가살을】 떨다.", "【가살을】 부리다.", "【가살을】 피우다."], "15": ["당신을 모욕할 생각은 【추호도】 없었습니다.", "그의 결심은 【추호도】 흔들리지 않았다.", "내 말에는 【추호의】 거짓도 없다.", "내가 결혼할 생각이 【추호라도】 있었다면, 10년 전에 했을 거다."], "16": ["역사상 여러 나라가 【내홍으로】 패망하였다.", "【내홍을】 겪다.", "【내홍이】 벌어지다.", "【내홍이】 일어나다."], "17": ["십오 세에 장가들어 아들 여섯 딸 셋, 생산은 푸짐하게 했지만 딸 하나 아들 셋, 눈앞에서 【참척을】 당해야 했다. ≪한무숙, 만남≫", "【참척의】 아픔.", "【참척을】 보다."], "18": ["많은 사람이 전란의 【와중에】 가족을 잃었다.", "회사 합병으로 어떻게 해야 하나 눈치를 보던 【와중에】 스카우트 제의를 받았다.", "밀고 밀리는 아우성 속에서도 두루뭉술한 행렬이 길게 뻗었다. 그 【와중에도】 새치기를 하려는 사람들로 해서 싸움은 곳곳에서 끊임없이 벌어졌다. ≪김민숙, 이민선≫", "그 승려의 얼굴엔 치열한 경쟁의 【와중을】 뚫고 직장을 잡은 자 특유의 자부가 흐르고 있었다. ≪김성동, 만다라≫"], "19": ["부엌은 가정 평화의 【온상이다】. ≪정비석, 비석과 금강산의 대화≫", "다이풍은 게릴라들의 【온상이라고】 해서 정부의 버림을 받은 마을입니다. ≪이원규, 훈장과 굴레≫", "범죄의 【온상】.", "민주주의의 【온상】."], "20": ["고요하기 태고 같은 이 풍경 속에서 순시도 멎음 없이 변화를 조종하는 기막힌 【조화는】, 대체 누가 부리는 요술이던가? ≪정비석, 비석과 금강산의 대화≫", "자연의 【조화】."], "21": ["그 연극은 무대 장치와 등장인물의 【조화가】 뛰어났다.", "두 눈과 하나의 코, 두 귀와 하나의 입으로 구성된 사람의 얼굴에서 우리는 진실로 기능과 작용의 아름다운 【조화를】 볼 수 있다. ≪안병욱, 사색인의 향연≫", "【조화가】 깨지다.", "【조화를】 이루다."], "22": ["완장이 없으면은 어떤 놈이 【권력】 있는 놈이고 어떤 놈이 【권력】 없는 놈인지 사람들이 알아먹을 수가 있어야지. ≪윤흥길, 완장≫", "한 번도 종대는 자신의 힘과 자신이 가진 절대의 【권력】 앞에 저항하는 사람을 만나 본 적이 없었다. ≪최인호, 지구인≫", "【권력】 강화.", "【권력】 남용."], "25": ["가능성 【타진】.", "의사 【타진】."], "26": ["【두터운】 교분을 유지하다.", "【두터운】 은혜.", "신앙이 【두텁다】.", "친분이 【두텁다】."], "27": ["그의 【끌끌하고】 점잖은 풍모는 재상이라도 따를 수 없었다."], "28": ["그는 말을 【시망스럽게】 해 다른 사람을 당황스럽게 한다.", "아이들이야 학교 가는 시간을 빼고는 내내 밖에서만 노는데, 놀아도 여간 【시망스럽게】 놀지 않았다. ≪최일남, 노새 두 마리≫"], "29": ["그의 눈가에 차가운 웃음이 잠시 【비꼈다】.", "나는 차성희의 얼굴에…홍조가 【비낀】 것을 보았다. ≪이병주, 행복어 사전≫"], "30": ["촛불에 머리카락이 【그슬리다】.", "계숙은 불에 【그슬린】 수영의 눈썹을 가만히 쓰다듬었다. ≪심훈, 영원의 미소≫"], "31": ["집안이 【구순하고】 편안하다.", "새사람 들어와서 모처럼 【구순해진】 집안에 평지풍파 일으키지 말게. ≪박완서, 미망≫", "【구순하게】 지내다."], "32": ["이 학교 독일어 선생으로 새로 임명된 사람이라고 대답하니 그제야 사무원은 몸을 【납신하고】 “아, 그러세요!” 하면서…. ≪유진오, 김 강사와 티(T) 교수≫"], "33": ["【부숭한】 눈두덩.", "【부숭한】 얼굴."], "34": ["청년의 【삽삽한】 태도에 마음이 누그러졌다."], "35": ["【찬찬치】 못하고 곰살궂지 못한 그는 제 몸치장에도 등한하였던 것이다. ≪현진건, 적도≫", "【찬찬한】 사람.", "【찬찬하게】 관찰하다."], "36": ["그는 자신의 이론에 대한 설명을 【각주에서】 밝혔다.", "【각주를】 달다.", "【각주를】 참조하시오."], "37": ["영화 【감상】.", "음악 【감상】."], "39": ["공연한 잡념으로 일엔 별 소출 없이 시간을 너무 흘린 것 같았다. 지금은 그런 조잡한 【망념에】 맛 들일 때가 아니던 것이다. ≪이문구, 장한몽≫"], "40": ["관민이 함께 협심하여 【적폐를】 일소했다.", "새로운 세제법이 이전의 【적폐를】 극복할 수 있기를 모두가 바란다."], "41": ["【가납사니】 같은 도시 사람들은 제멋대로 그럴싸한 소문을 퍼뜨리며…. ≪김정한, 모래톱 이야기≫"], "42": ["그는 20년간 회사에서 일을 하다가 교수가 되어 【늦깎이】 교수로 불렸다.", "【늦깎이로】 시작한 연기 생활이었던 만큼 그 길이 순탄치 않았다.", "【늦깎이로】 데뷔하다."], "44": ["주식 시장이 불안해지자 【뜨내기】 투자자는 떠나고 장기 투자자만 남았다.", "그는 【뜨내기가】 아니라 우리 가게 단골이다.", "회사가 안정되지 못해 여러 직원들이 【뜨내기처럼】 들락날락했다.", "집에 둔 머슴도 하늘만 보고 노는 판이니 【뜨내기】 일꾼을 필요로 하는 집은 없었다. ≪한무숙, 만남≫"], "45": ["“자네 같은 【살살이니까】 여전할 테지.” “그 말씀 하시려고 소인을 부르셨는가요?” ≪서기원, 조선백자 마리아상≫"], "46": ["동료에게 책임을 【전가하다】.", "나는 자신의 잘못을 남에게 【전가하는】 그에게 크게 실망했다.", "팀의 이번 패배를 두고 한 선수에게 책임을 【전가해서는】 안 된다는 목소리가 높다.", "그렇게 책임을 【전가하시면】 안 돼요. ≪이기영, 신개지≫"], "47": ["양털, 옥수수, 과실 따위를 대량으로 【생산하다】.", "수박을 【생산하다】.", "전기를 【생산하다】.", "철광을 【생산하다】."], "48": ["【곡진한】 사랑.", "대접이 【곡진하다】."], "49": ["그곳까지 걸어갈 생각을 하니 갈 길이 【망막하다】.", "【망막한】 우주.", "【망막한】 평원."], "50": ["한 소방수가 불길 속으로 【약진하며】 뛰어들었다."], "51": ["문제 해결을 위한 기발한 【착상이】 떠올랐다.", "컴퓨터는 계산기의 필요성에 관한 【착상에서】 발전되었다.", "그날을 골라서 두 번째의 범행을 모의한 것은 순전히 종대의 【착상이었다】. ≪최인호, 지구인≫", "【착상을】 얻다."], "53": ["군비 경쟁은 인류의 【자멸을】 가져올 뿐이다.", "그대들이 우리를 속인다면 【자멸이】 있을 뿐이다. ≪유주현, 대한 제국≫", "우리는 큰일을 이룩하기 위해서는 모두가 한마음 한뜻으로 뭉쳐야지, 분열이 오면 【자멸밖에】 없다는 것을 알아둬야…. ≪김춘복, 쌈짓골≫"], "54": ["가문을 능멸하는 마음보다는 제가 찾아 먹을 것을 빼앗긴 것 같은 【자멸과】 억울해하는 마음이 더했다. ≪박완서, 오만과 몽상≫"], "55": ["【유감의】 뜻을 표하다.", "내게 【유감이】 있으면 말해 보아라.", "우리는 불미스러운 일이 생긴 데 대해 【유감으로】 생각합니다.", "싸움터에 나가게만 해 주신다면 소인은 죽어도 【유감이】 없겠습니다."], "56": ["이 작품에 대한 너의 【유감을】 듣고 싶어.", "풀빛이 진해진 이파리들을 보니 봄날 【유감이】 더욱 새롭다."], "57": ["붓을 【놀려】 글씨를 쓰다.", "무척이나 기다란 상아 젓가락을 능숙하게 【놀렸다】. ≪안정효, 하얀 전쟁≫", "수창이는 소리가 안 나게 뜯느라고 조심스럽게 드라이버를 【놀렸다】. ≪황석영, 어둠의 자식들≫"], "59": ["그것은 처음 온 사람이라 해서 그런 것이요 윗사람이 아랫사람 【그느르는】 태도거나 또는 그만치나 설면하니까 인사치레로 그렇게 할 것이다. ≪염상섭, 모란꽃 필 때≫"], "60": ["손톱 밑의 때를 볼펜 끝으로 【호비다】.", "창틀에 낀 먼지를 꼬챙이로 【호벼】 파느라 힘이 들었다."], "61": ["석 달 동안 헤어져 있었대서 【설면할】 것은 없으련마는…. ≪염상섭, 취우≫"], "62": ["그의 행동은 【가살스럽기】 짝이 없다.", "【가살스러운】 웃음."], "63": ["그렇게 【가탈스럽게】 굴지 마라.", "그 사람처럼 【가탈스러운】 손님은 흔치 않았다."], "64": ["사내 녀석이 그리 【간살스럽게】 굴어서 어디다 쓰겠느냐? 똑바로 크게 말해라."], "66": ["아무리 애를 셋 키운다고 해도 이렇게 【귀살스럽고】 정신 사나워서 어떻게 사니?", "며칠을 쓸고 닦고 도배하고 나니 한결 집 꼴이 되어 가긴 했지만 어머니가 왜 오직 뼈대 하나만 보고 그 【귀살스러운】 집을 샀나를 이해한 것은 나중이었다. ≪박완서, 그 많던 싱아는 누가 다 먹었을까≫"], "67": ["하천의 【범람을】 막기 위해 제방을 쌓다."], "68": ["【항간에】 떠도는 소문.", "이 노래가 요즘 【항간에서】 유행하는 것이다.", "【항간의】 풍문을 모두 믿지는 마라.", "사연도 복잡하고 【항간에】 숱한 화제를 뿌렸던 허정윤과 양소림의 혼례는 시월 마지막 날에 거행되었다. ≪박경리, 토지≫"], "69": ["독립운동가들을 기리는 【추념】 공연이 열렸다.", "참사 희생자에 대한 【추념의】 마음을 담아 글을 적었다."], "71": ["암투와 음모와 【책동을】 자행하다.", "우리는 적의 오열을 경계하고 불순분자들의 【책동을】 철저히 분쇄합시다. ≪최일남, 거룩한 응달≫"], "72": ["새우젓은 【곰삭아야】 제맛이 난다.", "아욱국엔 마른 새우가 새빨간 꽃잎처럼 떠 있었고, 상추와 쑥갓은 싱싱했고 마늘장아찌는 알맞게 【곰삭아】 있었다. ≪박완서, 오만과 몽상≫"], "73": ["【곰상스럽게】 타이르다.", "【곰상스럽게】 대하다."], "74": ["【국으로】 가만히 있어라.", "【국으로】 굿이나 보고 떡이나 먹어라. ≪최인훈, 광장≫", "욕심이 사람 잡지. 그냥 【국으로】 있었으면 오늘날 저 지경은 안 됐을 텐데 말이야. ≪박경리, 토지≫"], "75": ["그런 말씀 마시오. 벌어먹고 사는 일이 【우세스러울 것】 조금도 없습니다. ≪박경리, 토지≫", "수빈이와 내가 남매 쌍둥이라는 게 【우세스럽다고】 할머니가 굳이 수빈이만 먼저 국민학교에 보내라고 우겨서 난 학교에 못 가고…. ≪박완서, 도시의 흉년≫"], "77": ["그날따라 【송영하는】 손님이 많아 택시를 잡기가 힘들었소. ≪이병주, 행복어 사전≫"], "78": ["나는 부드러운 말투로 분노한 사람들을 【무마하려고】 노력했다.", "나는 일을 그르쳐서는 안 된다고 그들을 간곡히 【무마했다】. ≪홍성암, 큰물로 가는 큰 고기≫", "길게 빼는 어투에는 좋잖은 심사를 【무마하려는】 노력이 있다. ≪박경리, 토지≫"], "79": ["우리는 그의 곁을 지날 때 땅바닥에 펼쳐 놓은 조그만 손수건 위에서 그의 전 소유물을 【일별할】 수 있었다. ≪이태준, 불우 선생≫", "전처만은 마뜩잖은 눈길로 그들을 【일별하고】 돌아서서 남은 길을 재촉했다. ≪박완서, 미망≫"], "80": ["김 씨는 공장 일을 【작파하고】 집에서 쉬고 있다.", "그는 생업을 【작파하고】 잃어버린 자식을 찾아 전국 구석구석을 다녔다.", "삼촌은 하던 공부를 【작파하고】 고향으로 내려가 버렸다.", "속이 상하기에 읽어 보자던 건 【작파하고서】 아저씨를 좀 따잡고 몰아세울 양으로 그 대목을 좍 펴놨지요. ≪채만식, 치숙≫"], "81": ["친정의 양친은 이미 사망하였고 집안도 【영락하여】 문밖 청량리로 옮겨 갔는데 집은 그럭저럭 체면을 유지할 만큼의 규모였다. ≪박경리, 토지≫", "아무리 바닥까지 【영락했어도】 양반의 핏줄이라는 마지막 자존심은 뾰루지처럼 남아 있어서…. ≪박완서, 미망≫", "【영락한】 가문."], "82": ["4천 년의 유구한 역사와 찬란한 문화와 독자한 【전통으로】 빚어진 3천만 겨레의 민족혼을…. ≪채만식, 민족의 죄인≫", "상급생도 하급생에 대해서 말을 할 땐 어디까지나 정중한 경어를 쓰는 게 그 학교의 【전통이었다】. ≪이병주, 지리산≫", "【전통】 계승.", "【전통】 의상."], "85": ["전통문화의 【계승과】 발전.", "역사는 문화 창조와 【계승의】 과정이라 할 수 있다."], "86": ["비법 【전수】.", "무공 【전수】.", "【전수를】 받다."], "87": ["묘책이라도 있으면 내게 좀 【전수를】 하시오. ≪김동인, 운현궁의 봄≫"], "88": ["한 치의 【더덜이도】 없이 딱 맞다."], "89": ["【게염이】 나서 나만 못살게 굴어."], "90": ["아사녀도 팽개와 싹불이가 인제 【노박이로】 와 있다는 말에 마음이 얼마나 든든한지 몰랐다. ≪현진건, 무영탑≫"], "92": ["어린 사람이 퍽 【드레가】 있어 보인다.", "권세도 좋고 돈도 좋지마는 아무리 【드레】 없는 뱃놈이라도 무슨 영금을 보건 눈썹 한 터럭 까딱 안 할 테니까. ≪이문구, 해벽≫"], "94": ["목의 힘 못지않게 입심도 센 여편네라 단골 가게에 퍼더버리고 앉아 【만수받이하랴】 삿대질해 가며 에누리하랴 날 저무는 줄 모르다가…. ≪박완서, 미망≫"], "97": ["영식이는 말 뒤를 【흐리마리하면서】 눈살을 찌긋하였다. ≪염상섭, 모란꽃 필 때≫", "유종은 말끝을 【흐리마리한다】. ≪현진건, 무영탑≫"], "98": ["그는 아들이 몸살이 났는데 보리 양식이 벌써부터 떨어져서 【갈급을】 하던 차에 돈 오 원을 얻고 보니 갠 하늘같이 마음이 트였다. ≪이기영, 고향≫", "상말로 수염이 석 자라도 먹어야 산다고 지금 안 선생이 어떻게 돈에 【갈급이】 들었는지 아시기나 하십니까? ≪김말봉, 찔레꽃≫", "돈에 【갈급이】 나다."], "99": ["전통의 계승과 【답습을】 혼동해서는 안 된다."], "101": ["음식의 【풍미를】 살리다.", "뛰어난 【풍미를】 자랑하다.", "들깨는 여러 나라에서 요리 재료로 쓰이나 품종과 기후에 따라 【풍미가】 조금씩 다르다.", "간장이나 된장은 오래 묵힐수록 깊은 【풍미가】 우러난다."], "102": ["마치 내 【흉금을】 읽은 듯이 그 작곡가는 그 꿈을 하나의 음악으로 만들어 들려주었다. ≪윤후명, 별보다 멀리≫", "지난봄에 셋이서 만나 【흉금을】 털어놓고 세상 돌아가는 이야기를 하고 돌아왔더니 이렇게 기분이 좋구나. ≪문순태, 타오르는 강≫", "【흉금을】 터놓다.", "【흉금을】 펴놓다."], "103": ["머리가 눌릴 만치 납작한 갑갑한 굴속이다. 게다 거미줄은 【예제없이】 엉키었다. ≪김유정, 만무방≫"], "104": ["그 자식 의심은 【되우】 많네.", "기운이 푹 꺼진 걸 보면 아마 【되우】 괴로운 모양 같다. ≪김유정, 금≫", "【되우】 앓다.", "【되우】 빠르다."], "106": ["고향을 생각하면, 마음이 【모지락스러운】 팔봉이였지만 갑자기 목울대가 후끈거리면서 울컥 울음이 솟구치려고 하였다. ≪문순태, 타오르는 강≫", "자기 주먹을 맞고 쓰러진 놈 중에 놀랍게도 어린애가 끼어 있음을 알아차린 바로 그 순간부터 【모지락스럽게】 세운 그의 계획은 사실 중대한 차질을 빚기 시작했던 것이다. ≪윤흥길, 완장≫"], "107": ["그는 【짜장】 사실인 것처럼 이야기를 한다.", "제발 남편이 신발과 댕기를 사 오기를 축수하고 나서, 【짜장】 댕기와 고무신을 사 오지 않으면 사생결단으로 싸워 보리라 마음먹었다. ≪정비석, 성황당≫", "기를 쓰고 가르쳐 본댔자 소 귀에 경 읽기라는 말이 【짜장】 헛된 이야기만도 아닌 셈이었다. ≪박태순, 어느 사학도의 젊은 시절≫"], "108": ["그는 어제 사건에 관하여 일체 【함구하고】 있다.", "그 삼 년 뒤 언니를 찾아와 함께 살게 된 봉추댁도 결코 안 천총의 과거는 혀가 끊어진 듯 【함구함으로써】 안 천총을 더욱 신비하게 보이게 했던 점도 사실이었다. ≪김원일, 불의 제전≫"], "109": ["반가운 소식을 접하니 기쁘고 【흔연하기】 짝이 없습니다.", "꺽정이가 김 씨의 얼굴을 들여다보며 웃으니 김 씨도 【흔연하게】 마주 웃었다. ≪홍명희, 임꺽정≫"], "110": ["상대방 탓이라고 서로를 【힐난하다】.", "환경 단체는 숲이 파괴되는 것을 알면서도 모른 척했다고 정부를 【힐난했다】.", "왜 봉투를 열었느냐고 명욱을 【힐난할】 순 없었다. ≪이병주, 행복어 사전≫", "억쇠는 끝까지 영감의 색시에 대한 교만성과 낡은 지주 근성을 【힐난하고】 장 첨지는 억쇠의 불손함과 논을 떼게 된 정당성을 주장하였다. ≪오유권, 대지의 학대≫"], "111": ["제 일에만 【골몰하다】.", "대책 마련에 【골몰하다】.", "보고서 작성에 【골몰하다】.", "시골에서 과거 공부에만 【골몰하고】 지내 온 사영은 천주학이 무엇인지 몰랐다. ≪한무숙, 만남≫"], "113": ["결혼식 【부조】.", "장례식 【부조】."], "114": ["현관의 문은 두껍고 굵직한 참나무로 짜이고 그 위에 엷은 【부조가】 있다. ≪최인훈, 가면고≫"], "115": ["최소한의 【구색을】 갖추다.", "영계백숙에 시골에서 맛볼 수 있는 밭 채소 등을 요모조모 【구색】 갖추어 차려 낸 솜씨가 또한 보통이 아니었다. ≪전상국, 하늘 아래 그 자리≫", "장독대랑 마루나 부엌살림을 보면 큰살림하던 【구색을】 제법 갖추고 있었다. ≪박완서, 그 가을의 사흘 동안≫", "다양한 【구색】."], "116": ["그 노인은 고령이지만 자신의 【가령에】 얽매이지 않고 활기차게 살아간다."], "117": ["【가령】 너에게 그런 행운이 온다면 너는 어떻게 하겠니?", "【가령】 누가 너한테 그런 소릴 했다고 치자. ≪박태순, 어느 사학도의 젊은 시절≫"], "118": ["어제저녁 내내 속이 【보깨어】 혼났다.", "“괜찮습니다. 아침에 무어 좀 먹은 것이 【보깨는】 듯합니다.” 하고 얼른 변명을 한다. ≪박종화, 임진왜란≫"], "119": ["날씨가 【물쿠고】 무덥더니 비가 내리기 시작하였다."], "120": ["웬만하면 참지 그만한 일로 뭘 그리 【결내는가】?"], "121": ["그동안 잘 【가말아】 온 일이 벽에 부딪혔다."], "122": ["그는 마음이 【달떠서】 일이 손에 잡히지 않았다.", "여행을 간다는 생각에 【달떠서】 시험공부가 되지 않는다.", "도대체 예술가라고 하는 이들은 공연히 허영에 【달떠】 가지고 되지도 않게 잘난 체하거든. ≪유진오, 화상보≫"], "123": ["갑득이가 자배기 속의 국밥을 【게염스러운】 눈으로 들여다보더니 먼저 한 술을 푹 떠냈다. ≪김원일, 노을≫", "너무 살이 쪄서 징글스럽게 생각하던 것은 부골로 보이고 능글능글하고 【게염스럽게】 보이던 것은 틀지고 호걸스럽게 보였다. ≪한용운, 흑풍≫"], "124": ["【곰상스럽게】 타이르다.", "【곰상스럽게】 대하다."], "125": ["왠지 저 사람은 좀 【내숭스러워】 보인다.", "【내숭스럽게】 굴지 말고 좀 솔직할 줄 알아라.", "저런 능청, 첨부터 사람이 어째 【내숭스럽더라니】. ≪조해일, 아메리카≫"], "126": ["하야시는 살무사가 혓바닥을 널름거리듯 음흉하고 【느물스럽게】 웃고 있었다. ≪문순태, 타오르는 강≫", "【느물스럽게】 말하다."], "127": ["외국어 능력의 【계발】.", "평소에 자기 【계발을】 계속한 사람은 좋은 기회가 왔을 때에 그것을 잡을 수 있다.", "상상력 【계발】."], "128": ["그는 자신이 경찰인 것에 【긍지를】 가지고 있다.", "회복되어 가는 재영이의 건강에서 자기의 의술적 수완에 대한 【긍지를】 느낌인지, 재영이의 치료에는 전력을 다하였다. ≪김동인, 젊은 그들≫", "【긍지가】 높다.", "【긍지로】 삼다."], "132": ["그는 나를 【핫바지로】 여기며 무시한다.", "도대체 우리를 【핫바지로】 알아도 분수가 있지, 어떻게 민의를 대표하는 국회 의원들이 돼 가지고 법을 그렇게 식은 죽 먹듯이 고치고 앉아 있는 거야?"], "133": ["그녀는 작은 잘못으로 그만 주인집에서 쫓겨나 【떨꺼둥이가】 되었다."], "135": ["영두만 한 【무녀리가】 없는 줄 알았는데 의곤이에 대면 영두는 오히려 씨억씨억하고 실팍한 터수였다. ≪이문구, 산 너머 남촌≫", "순평이 같은 그런 【무녀리는】 이따금 그렇게 혼이 나야만 사람이 돼 갈 것 같기도 했다. ≪이문구, 장한몽≫"], "136": ["김 박사가 의술이 뛰어나다는 평판이 온 동네에 【자자하게】 퍼졌다.", "근무 조건이 나쁘다는 사원들의 불평이 회사 내에 【자자했다】.", "고을 수령의 폭정으로 백성들의 원성이 【자자했다】.", "그는 인근에 소문이 【자자할】 만큼 지독한 구두쇠였다."], "137": ["이황과 이이는 조선 시대 성리학에서 【쌍벽을】 이루는 거목들이다.", "신성이와 문자는 이번 졸업생 중에 재원으로 가위 【쌍벽이다】. ≪염상섭, 모란꽃 필 때≫", "【쌍벽을】 이루다."], "138": ["우리는 파격적인 그의 그림이 무엇을 【함의하고】 있는가를 어렴풋이 느낄 수 있었다."], "139": ["【계륵】 취급을 받던 폐식용유가 연료로 재활용될 예정이다.", "금리가 인상되면서 이전에 들었던 정기 예금이 【계륵이】 되었다."], "140": ["플라톤이 소크라테스를 얼마나 【사숙하고】 경도하고 앙모하였는지는, 플라톤이 신에게 드린 네 가지 감사 속에서 넉넉히 읽을 수가 있다. ≪안병욱, 사색인의 향연≫"], "143": ["일기에 하루의 【감상을】 적는 시간은 자신을 되돌아보는 시간이기도 하다.", "그곳에서의 【감상은】 황량하다는 느낌뿐이었다.", "그 책을 읽은 【감상은】 한마디로 ‘대단하다’였다.", "그는 수신사 편에 몇 편의 일본 서적을 얻어 읽고 유배지에서 아들들에게 【감상을】 써 보내고 있다. ≪한무숙, 만남≫"], "144": ["【연패의】 늪에 빠지다.", "동학군이 【연패를】 하여 지치면 진주성 공략을 나서기 전에 기습을 감행하겠다는 태도였다. ≪유현종, 들불≫", "【연패】 탈출.", "【연패를】 당하다."], "145": ["그 선수는 작년에 이어 올해 마라톤 경기에서도 우승함으로써 2년 【연패를】 기록했다."], "146": ["무슨 말인지 【당최】 모르겠다.", "어찌 된 일인지 【당최】 알 수가 없어."], "148": ["그의 걸쭉한 【너스레에】 우리 모두 크게 웃었다.", "김치걸이가 대번에 기고 나오며 술대접까지 하겠다고 【너스레가】 흐드러지자 두 사람은 어리둥절했다. ≪송기숙, 녹두 장군≫", "설령 대단치 않은 것도 그 【너스레가】 너무 재미있어서 모두 그의 얘기를 듣고 싶어 하죠. ≪이영치, 흐린 날 황야에서≫", "【너스레를】 놓다."], "149": ["그는 자기의 【깜냥을】 잘 알고 있었다. ≪이기영, 봄≫", "장마 통에 집을 잃고 【깜냥엔】 비를 피해 오길 잘했다고 안심하는 성싶었다. ≪윤흥길, 장마≫"], "150": ["무시래기와 고구마 넝쿨을 툇마루에 올려놓는 것 외에는 달리 【비설거지를】 할 만한 게 없었다. ≪이문열, 영웅시대≫", "초저녁에는 별이 보이게 맑았는데 밤에 한차례 빗발이 뿌려서 단원들은 잠을 설치며 【비설거지를】 해야 했지만 다행히 비는 새벽에 그쳤다. ≪한수산, 부초≫"], "151": ["경주에 가면 낮은 산과 같이 【두두룩두두룩】 늘어선 고분들을 어디서든 볼 수 있다."], "152": ["털이가 안 된다는 까닭을 【미주알고주알】 캐내서 수다 늘어놓는데 주만은 참다못하여 소리를 빽 질렀다. ≪현진건, 무영탑≫", "그러나 노파는 더욱 바싹 다가들며 요모조모 살피듯이 【미주알고주알】 캐어물었다. ≪이호철, 소시민≫"], "153": ["싸움에 진 병사들이 【버르적버르적】 팔다리를 저을 뿐 일어날 줄 몰랐다."], "154": ["【주저리주저리】 달리다."], "155": ["무계획적으로 【휘뚜루마뚜루】 돌아다니고 싶다. ≪이희승, 먹추의 말참견≫"], "156": ["영희는 【목하】 열애 중이다.", "어느 편이 시작했던 【목하】 전쟁 중에 있다는 건 사실이 아닌가. ≪이병주, 지리산≫", "【목하】 휴업 중."], "157": ["오전에 일을 【거반】 했으니 나머지 반은 오늘 안으로 마칩시다."], "158": ["나는 아니라고 【극구】 부정하고, 또 사과하고 위로하느라고 한동안 쩔쩔매는 시늉까지 해야 했다. ≪박완서, 도시의 흉년≫", "자식을 칭찬하는 말에 흡족한 형수는 아주머니의 음식 솜씨가 좋다고 【극구】 찬양했다. ≪이병주, 행복어 사전≫", "【극구】 사양하다.", "【극구】 만류하다."], "159": ["그는 하룻밤에 【물경】 수천만 원이나 도박으로 날렸다.", "혼자 멍하니 공상에 잠기는 버릇만 늘더니 【물경】 십 등이나 석차가 떨어지고 만 것이다. ≪김원일, 노을≫"], "160": ["무심히 웃고 있던 여자의 얼굴에서 【졸연】 웃음이 지워지며 퍼뜩 눈이 긴장하는 것 같더라니…. ≪채만식, 냉동어≫"], "161": ["날씨가 건조해지자 손톱 주위에 다시 【거스러미가】 일기 시작했다.", "분결같이 희고 붓끝같이 고운 손이다. 굳은살 하나, 【거스러미】 하나 없는 살이다. ≪이광수, 흙≫", "판자의 【거스러미】."], "163": ["아내가 남편의 【목물을】 해 주다.", "윗옷을 훌떡 벗고 【목물을】 하다."], "164": ["이번 생일 케이크 상자는 【가두리가】 예쁜 꽃무늬로 둘려 있었다."], "165": ["물꼬를 생판 하늘에다 대고 있는 【천둥지기라】, 농사를 지어도 먹고 못 먹기는 처음부터 하늘에 매였는데…. ≪송기숙, 녹두 장군≫", "지적지적한 생수받이와 보 어귀가 마를 지경이니 【천둥지기와】 건답에는 먼지가 폴싹폴싹 일어나게 되었다. ≪박종화, 다정불심≫"], "166": ["밑천에서 몇 배의 이익을 남길 【가량으로】 가게를 샀다.", "아픈 아이에게 약이 필요하지만 지금으로서는 아무 【가량도】 없는 형편이다.", "만약 최 마름 【가량대로】 그것이 삼등지였다면 한 마지기의 소출이 적어도 한 섬 한 가마 꼴로는 나왔어야 옳을 일이었다. ≪이문구, 오자룡≫"], "167": ["【오찬】 간담회.", "【오찬에】 참석하다.", "【오찬을】 열다.", "【오찬을】 베풀다."], "168": ["학회는 결정적 증거가 나오기 전까지 새 학설의 【공표를】 미루기로 결정하였다."], "170": ["이러한 사실을 【전철】 삼아 어떤 대비를 취함으로써 오히려 불행을 행으로 돌릴 수 있겠다. ≪유치환, 나는 고독하지 않다≫", "이 과오는 이미 오카와 박사가 범했거니와 그 【전철을】 또 한 번 이 글이 답습한다는 것도 우스운 노릇입니다. ≪김소운, 일본의 두 얼굴≫"], "171": ["반품 및 교환은 물품 【수령】 후 3일 안에만 가능합니다."], "172": ["노론의 【수령】 우암 송시열.", "동학군의 【수령】 전봉준."], "173": ["【배수를】 등에 진 공주성은 과연 천험의 요새지였다. ≪유현종, 들불≫", "【배수의】 진."], "174": ["이 논은 【배수가】 잘된다.", "폭우에 대비하여 【배수】 시설을 충분히 갖추어 놓았다.", "【배수가】 안되는 땅에는 농작물이 자라지 못한다.", "【배수】 작업."], "175": ["전입 신고 【수리가】 완료되었습니다.", "회사에서 사표 【수리를】 거부하는 바람에 퇴사가 미루어지고 있다."], "177": ["서태석인가 하는 사람은 보통 똑똑한 사람이 아니라던데, 얼핏 보아도 허우대부터가 【드레져】 보입디다. ≪송기숙, 암태도≫"], "178": ["솜바지는 여기저기 터져 회색으로 전 솜뭉치가 【비어져】 나와 있었다. ≪김원일, 불의 제전≫", "양 볼을 감싼 명주 수건 사이로 【비어져】 나온 머리칼이 바람에 나부낀다. ≪박경리, 토지≫"], "179": ["사업에 실패했던 원인을 이제야 【깨단하게】 되다니."], "180": ["바람에 현수막이 【뒤쳐지다】.", "화투짝이 【뒤쳐지다】."], "181": ["나는 부탁을 들어주지 못하는 것이 친구에게 【점직하였으나】 다음에 다시 오라는 말밖에 할 수 없었다.", "태수는 너무 덤빈 것이 【점직해서】 뒤통수를 긁는다. ≪채만식, 탁류≫", "소년은 때 묻은 손을 내밀기가 선생님께 【점직한지】 손을 등 뒤로 슬며시 감추었다."], "182": ["파도가 【넘실넘실】 뱃전을 두드리다."], "183": ["고양이가 움직일 때마다 방울이 【달랑달랑】 소리를 낸다.", "귀고리가 【달랑달랑】 흔들린다."], "184": ["저보다 좀 나은 사람한테는 【알랑알랑】 강아지 새끼처럼 꼬랑지나 흔들고, 저만 못해 뵌 사람은 사람 취급도 않고…. ≪이문구, 장한몽≫"], "186": ["그녀는 배가 아래위로 【일렁일렁】 움직이자 몹시 어지럽고 멀미가 났다."], "187": ["김 선수는 3점 슛에서 【두각을】 보여 주전으로 선발됐다.", "강태는…학업에도 그만큼 남다른 【두각을】 나타냈다. ≪최명희, 혼불≫", "【두각을】 드러내다."], "189": ["말을 꺼냈다가 아버지에게 【일축을】 당한 후는 잘 들르지도 않는 그들이었다. ≪한무숙, 어둠에 갇힌 불꽃들≫", "【일축을】 당하다."], "190": ["그는 세상 물정을 모르는 【숙맥이다】.", "너 같은 【숙맥더러】 그런 말을 하는 내가 그르지. ≪현진건, 술 권하는 사회≫", "정말 돌았군. 그 말라깽일 아직 못 잊어서 그러는 거야? 이 【숙맥아】. ≪황순원, 나무들 비탈에 서다≫"], "192": ["아직 영업을 시작하지 않아서 【하릴없이】 식당 앞에서 기다려야 했다.", "지낼 곳이 없어 【하릴없이】 떠돌아다녀야 했다.", "그러면 숫제 알거지가 되어 여덟 식구가 【하릴없이】 쪽박을 찰 수밖에 없었다. ≪송기숙, 녹두 장군≫"], "193": ["밝고 따스하고 즐거운 봄 입김은 【가뭇없이】 사라지는 듯하다. ≪현진건, 적도≫"], "194": ["밤하늘에 【가없이】 떠 있는 수많은 별들.", "【가없이】 넓은 벌판에서는 매일같이 아롱아롱한 아지랑이가 떠올랐다. ≪한설야, 탑≫", "【가없이】 넓은 바다."], "195": ["죄인을 잡는다고 【물색없이】 설치다간 자칫 민폐가 되기 십상이오. ≪현기영, 변방에 우짖는 새≫", "글쎄 그런 것을 나 혼자서만 건성 김칫국을 마시듯이 【물색없이】 좋아하다니! ≪채만식, 탁류≫"], "196": ["어머니는 아들 잃은 설움에 【하염없이】 먼 산만 바라보고 있다.", "이순신 장군은 【하염없이】 자기의 나이를 회상해 본다. 어느덧 자기는 쉰세 살이 되었다. ≪박종화, 임진왜란≫"], "197": ["전쟁 전체를 놓고 보면 미안한 일이지만 수많은 사람들을 고통의 【질곡으로부터】 구할 수 있었다. ≪이원규, 훈장과 굴레≫", "【질곡의】 세월.", "【질곡에서】 벗어나다.", "【질곡에】 빠지다."], "198": ["역사상 【유례가】 없는 이변.", "【유례를】 찾아볼 수 없는 호황."], "199": ["불꽃놀이가 축제의 【대미를】 장식했다.", "모든 지역민이 참가하는 유왕산 등산 놀이가 절정을 이룸으로써 4일간의 문화재 행사의 【대미를】 맞는다. ≪이청준, 춤추는 사제≫"], "200": ["【유해를】 모시어 안장시키다.", "연학이 향로와 향을 들고 들어왔다. 【유해】 앞에 향을 피워 놓고 연학은 엎드렸다. ≪박경리, 토지≫", "【유해를】 안치하다."], "201": ["이산가족의 【애환과】 염원.", "뿌옇고 떫고 심심한 그 막걸리에는 한국인의 소박한 【애환이】, 김삿갓의 그 웃음 같은 것이 그대로 깃들어 있다. ≪이어령, 흙 속에 저 바람 속에≫", "삶의 【애환】."], "202": ["사병들은 전선을 이탈한 채 곳곳에서 어둠을 통해 적이라고 믿어지는 정체불명의 집단들과 【조우했다】. ≪홍성원, 육이오≫", "두 사람은 한 번도 【조우해】 본 적이 없다.", "길을 가다가 옛 친구를 【조우했다】."], "203": ["생각지도 않은 곳에서 옛 친구들을 【봉우하니】 너무 반갑다.", "나는 어릴 적 친구와 우연히 길에서 【봉우했다】.", "버스 안에서 【봉우한】 그들은 서로의 안부를 물었다."], "204": ["옛 친구와 【상봉하다】.", "이제는 고향에 돌아가 그리운 부모와 【상봉하게】 되었다.", "이산가족이 【상봉하다】.", "타향에서 고향 친구를 【상봉했다】."], "206": ["헤어졌던 친구와 십여 년 만에 【해후했다】.", "부모 자식이 20년 만에 【해후했으니】 할 말이 오죽 많겠니?"], "207": ["오래 앓아서인지 얼굴은 홀쭉하게 【여위고】 두 눈만 퀭하였다.", "【여윈】 손."], "208": ["그는 일찍이 부모를 【여의고】 고아로 자랐다.", "알뜰히 사랑하는 애인을 【여의고】 아까운 청춘을 철창에서 썩히고, 그 빌미로 중병까지 들어…. ≪현진건, 적도≫"], "209": ["하수도 구멍이 【메다】.", "밥을 급히 먹으면 목이 【멘다】.", "웅덩이가 【메다】."], "210": ["신발 끈을 【매다】.", "옷고름을 【매다】."], "211": ["은행에 적금을 【붓다】."], "212": ["재산이 【붇는】 재미에 힘든 줄을 모른다.", "마당에 노적가리가 열둘이더라도 쌀 한 톨을 초판 쌀로 애바르게 여겨야 살림이 【붇는】 것이고…. ≪송기숙, 암태도≫", "개울물이 【붇다】.", "체중이 【붇다】."], "213": ["그의 몸무게는 나보다 【갑절이나】 무겁다.", "이곳 집값은 다른 곳의 【갑절이다】.", "연휴를 앞둔 토요일이라 서울을 빠져나가기가 【갑절로】 힘들다."], "214": ["영농 방식을 이처럼 개선하면 소득이 몇 【곱절】 높아지게 됩니다.", "세 【곱절】.", "여러 【곱절】."], "215": ["이웃에게 양식을 【빌다】.", "사람들에게 밥을 【빌러】 다니다.", "그들 부부는 집집마다 다니며 밥을 【빌었다】."], "216": ["이 자리를 【빌려】 감사의 말씀을 드립니다."], "217": ["경사스러운 일이 【곰비임비】 일어난다.", "병일은 【곰비임비】 술을 들이켰다. ≪현진건, 적도≫"], "218": ["서울 사는 아들도 어쩌다 한 번씩 【다문다문】 집을 찾아왔다.", "【다문다문】 나다니던 바깥출입조차 달포 넘게 끊은 채 집 안에서만 박혀 지냈다. ≪김원일, 불의 제전≫"], "219": ["그의 마음은 【숭굴숭굴】 너그럽다.", "그녀는 동네에 소문이 날 만큼 【숭굴숭굴】 모가 없이 후덕하다."], "220": ["바쁜 일정 때문에 부족했던 저녁 식사를 모처럼 【이드거니】 먹었다."], "222": ["【혼신의】 노력을 다하다.", "그는 불쌍한 이웃을 위해 평생 【혼신을】 바쳐 봉사하며 살았다.", "주어진 자기 삶에 밀착하여 【혼신으로】 끌어안고 치열하게 살다 간 송관수…. ≪박경리, 토지≫", "【혼신의】 힘을 쏟다."], "223": ["남의 【구설에】 오르다.", "총각 선생이 밤중에 처녀 선생이 묵고 있는 집에 발걸음한다고 괜한 【구설을】 들을지도 모르는 일이었다. ≪윤흥길, 묵시의 바다≫"], "224": ["체면에 그럴 수가 없다거나, 남편 된 책임상 피할 수 없어서 나가 봐야 한다는 말인가. 흥! 그런 생각은 【염두에도】 없거니와 그런 마음에도 없는 것을 하지 않으면 안 될 이유는 어디 있는가? ≪염상섭, 만세전≫"], "225": ["10여 개의 팀이 우승을 놓고 【각축을】 벌였다.", "중국 시장을 둘러싼 각국의 【각축은】 더욱 치열해질 것 같다.", "외세의 【각축】."], "227": ["그는 꾀도 없고 눈치도 없는 【덩둘한】 사람이다."], "228": ["모두가 모인 자리에서 약간 【되통스러운】 친구의 질문을 받고는 무척 곤혹스러워했다.", "성격이 【되통스럽다】."], "229": ["소갈머리 또한 【푼푼하여】 어디에 내돌려도 눈치 먹은 적이 없던 사내였다. ≪이문구, 오자룡≫", "【푼푼한】 성품."], "230": ["【곰살궂게】 굴다."], "232": ["아비 어미가 있는데 왜 구박을 받겠니. 쓸데없는 걱정한다. 네 【일신】 생각이나 좀 해라. ≪박경리, 토지≫", "【일신을】 보존하다."], "233": ["재벌 기업마다 수재 의연금의 【각출을】 약속하였다."], "234": ["한 해 동안 살아온 나날을 누구보다 잘 헤아려 줄 것 같은 조왕신에게 【저간의】 사정을 말하는 효원의 심정은…. ≪최명희, 혼불≫", "【저간의】 소식."], "235": ["나라에서 심하게 세금을 수탈해 백성들이 【도탄에】 빠졌다.", "관리는 부패하고 국민은 【도탄에서】 허덕이고 있소. ≪유주현, 대한 제국≫", "【도탄에】 들다.", "【도탄에】 빠뜨리다."], "236": ["산 【정상에】 자리 잡은 관측소.", "야산의 둥그스름한 【정상에는】 몇 그루의 소나무가 상투처럼 외로이 서 있었다. ≪김원일, 불의 제전≫", "지리산의 【정상】.", "【정상에서】 내려오다."], "237": ["공장이 【정상으로】 가동되다.", "지하철이 【정상적으로】 개통되다.", "그 사람은 【정상이】 아니다.", "【정상】 수업."], "238": ["너희들은 도망칠 수 없다. 순수히 나와 자수한다면 【정상을】 참작하겠다. ≪최인호, 지구인≫", "【정상을】 참작하다."], "239": ["폐허가 되어 버린 그 집 뜰에는 【멀쑥하게】 자란 소나무만이 바람에 흔들거리고 있었다.", "몸이 형편없이 야위었고 키만 【멀쑥했다】. ≪황석영, 몰개월의 새≫"], "240": ["구름 같은 머리 쪽엔 백옥 죽절이 【맵자하게】 가로 꽂혔다. ≪박종화, 다정불심≫", "옷차림이 【맵자하다】."], "241": ["나는 그의 행동이 【마뜩하지】 않다.", "그들의 성공이 【마뜩지】 못한 과정을 통해 이루어졌음이 밝혀졌다.", "이성신 교장은 김형수의 전학 서류를 갖춰 결재를 맡으러 들어가자 몹시 【마뜩지】 않은 인상으로 트집을 잡았다. ≪전상국, 음지의 눈≫"], "242": ["그는 자신의 마음을 들킨 것이 【머쓱해서】 웃고 말았다.", "그는 면박을 받고는 【머쓱하여】 머리를 긁적였다.", "사내가 물러가자 나는 오히려 【머쓱한】 기분이 들었다. ≪윤후명, 별보다 멀리≫"], "243": ["이제 곧 숨도 못 쉬게 조일 것이니 지금은 그때를 위해서 【낙낙하게】 풀어 두는 것이 좋은 때문이다. ≪최명희, 혼불≫"], "245": ["쥐가 미끼를 【답삭이는】 순간 덫에 걸렸다."], "246": ["공연히 이리저리 【바장이다가】 집으로 내려가는 중에 부산동서 살인이 났단 말을 듣고 여러분 일이 궁금해서…. ≪홍명희, 임꺽정≫"], "249": ["주위의 【빈축을】 무시하다.", "그런 짓은 모든 사람의 【빈축과】 비난을 사기 알맞은 짓이었다. ≪박완서, 오만과 몽상≫", "등 뒤에 그 집 딸의 【빈축이】 담긴 시선을 느꼈다. ≪이병주, 행복어 사전≫", "【빈축을】 사다."], "250": ["어린 마리아도 이 책을 필사하면서 교리의 【터득과】 신앙의 심도를 더해 갔던 것이다. ≪한무숙, 만남≫"], "251": ["우리 선생님은 비록 【눌변이시지만】 열성적인 강의로 우리를 감동시키곤 하셨다.", "상희 앞에서는 【눌변에】 가까운 그가 이상하게도 이런 이야기를 할 때만은 열변이었고 또한 거의 웅변이기도 했다. ≪손창섭, 낙서족≫"], "252": ["퇴로를 차단당한 낙오 병력과 지방 공비들이 곳곳에서 여전히 【준동을】 계속하고 있었다. ≪이청준, 소문의 벽≫", "장군은 일본 수군의 【준동이】 반드시 또 한 번 크게 있을 것을…. ≪박종화, 임진왜란≫"], "253": ["그믐산이는 말이 쉽사리 되어 나오지 않아 선뜻 입을 열지 못한 채 【주눅에】 씌어 식은땀만 흘리고 있었다. ≪이문구, 오자룡≫", "【주눅이】 들다."], "254": ["우리 집 애어미 말을 들으니 그동안 내외간에는 여러 번 【티격이】 있었던 것 같아. 연엽이 아버지 고함 소리가 울 밖에까지 넘어오는 것을 여러 번 들었다더만. ≪송기숙, 암태도≫", "【티격을】 벌이다.", "【티격이】 붙다."], "255": ["그는 낫과 지게의 【닦달에】 한동안 시간을 들이고서야 나무를 하러 갈 수 있었다.", "이 가구가 그래도 【닦달만】 잘하면 다시 새것처럼 깨끗해질 것일세."], "256": ["【울력을】 믿고 함부로 덤비다.", "저기 저 농로도 지난여름에야 동네 사람들이 【울력을】 해서 낸 거란다. ≪서정인, 벌판≫"], "258": ["이 사람을 반드시 기억해 두시오. 후일 그를 얻으면 삼군(三軍)의 【영수로】 삼고 무후(武侯)에 봉할 것이외다. ≪이문열, 황제를 위하여≫", "여야 【영수】 회담."], "259": ["하기야 이 형은 전번에도 내게 이 섬 원장 노릇을 너무 오래 하고 싶어 한다고 이만저만 호된 【공박이】 아니었으니까. ≪이청준, 당신들의 천국≫", "왜 모호하고 애매하게 ‘글쎄요’라고 하느냐고 제때에 가해져 오는 염상진의 【공박이었다】. ≪조정래, 태백산맥≫", "【공박을】 받다.", "【공박을】 당하다."], "260": ["우리 사이에는, 나눈 이야기는 서로 발설하지 않는다는 【묵계가】 이미 성립되어 있었다.", "결국 차 서방 아들을 김씨 집안 양아들로 받아들이기로 어른들 사이에 【묵계가】 이루어진 셈이군요? ≪윤흥길, 무지개는 언제 뜨는가≫"], "261": ["그는 원군 삼백을 더 지원받고 이 차 공격에 나섰다. 그러나 또한 무위로 끝났다. 【공방】 두 달. 그러나 승부는 나지 않았다. ≪유현종, 들불≫", "【공방을】 벌이다.", "【공방이】 치열하다."], "263": ["벽에 【균열이】 생기다.", "이 도읍을 다스리던 방백들의 공덕비가 혹은 서 있고 혹은 비뚜름히 기울어 있고 더러는 【균열이】 진 채 누워 있었다. ≪홍성암, 큰물로 가는 큰 고기≫"], "264": ["방송 차량을 이용한 【유세】 활동.", "운동장에서 국회 의원 후보자의 【유세가】 열렸다.", "선거 【유세】."], "265": ["반장도 권력이라고 【유세가】 대단하다.", "아들만 둘을 낳았다는 【유세로】 자기는 임씨 집안의 며느리로서 책임을 다했거니 하고 순간적으로 교만한 마음을 품었다가…. ≪윤흥길, 완장≫", "【유세를】 떨다.", "【유세를】 부리다."], "266": ["【금새를】 알아보다.", "【금새를】 조사하다."], "267": ["시루에 떡을 【안치다】.", "솥에 고구마를 【안쳤다】.", "솥에 쌀을 【안치러】 부엌으로 갔다.", "천일네도 소매를 걷고 부엌으로 들어서며 작은 솥에 물을 붓고 가셔 낸 뒤 닭을 【안치고】 불을 지핀다. ≪박경리, 토지≫"], "268": ["아침을 대충 【걸치다】.", "술을 【걸치다】."], "269": ["그릇을 물로 【부시다】.", "밥 먹은 그릇은 깨끗이 【부셔】 놓아라.", "솥을 【부시다】."], "270": ["차림새만 봐서는 여자인지 남자인지 【가름이】 되지 않는다."], "271": ["나는 식탁 위에 밥을 차릴 겨를도 없이 닥치는 대로 【게걸스럽게】 식사를 해치웠다. ≪최인호, 돌의 초상≫"], "273": ["그는 【매욱스러운】 탓에 아이들한테 늘 놀림을 받지만 마음은 착하다."], "274": ["요즘에는 어머니에게도 마구 바락바락 들이덤비는 게 그 행실이 꽤 【발만스럽습니다】. ≪김유정, 아기≫"], "275": ["내가 너를 버리고 어찌 살겠니? 【새퉁스러운】 소리 하지 말고 나를 믿어라. ≪박종화, 임진왜란≫"], "276": ["그는 아무런 【기탄이】 없이 말을 이었다."], "277": ["【과문의】 소치에서 비롯된 잘못.", "청사에 남을 만큼 이름난 집안인지 나로서는 【과문의】 탓으로 알지 못하오. ≪박경리, 토지≫"], "278": ["심유경은 왜말을 잘할 줄 알면서도 일부러 심가왕에게 【통변을】 시켜 따져 본다. ≪박종화, 임진왜란≫"], "279": ["향가 【소고】."], "280": ["남아 선호 사상의 【불식을】 위해 남녀 차별 사회 관행에 대한 제도적 보완이 필요하다.", "불신 풍조 【불식】.", "의혹에 대한 【불식】."], "281": ["돗자리의 올이 굵고 【성글게】 짜이다.", "그는 머리칼은 【성글었으나】 인물은 훤하였다.", "굵어져 후드득 【성글게】 떨어지는 빗방울이 얼굴을 때렸으나 그는 유쾌했다. ≪유주현, 하오의 연가≫"], "282": ["조약돌 【잠방이는】 소리가 듣기에 참 좋다.", "명상에 잠겨 있는데 옆에서 아이가 물에 발을 【잠방이며】 방해했다."], "283": ["순평이 왕년에 첫 경험 없어 본 놈 있다더냐고 【흰소리할】 밑천을 벌어 둔 건, 스무 살도 저물어 섣달 초승이었다고 기억된다. ≪이문구, 장한몽≫"], "284": ["홍 거사는 웅보를 종놈치고는 어딘지 【웅숭깊은】 데가 있다고 생각했는지 그날부터 밤을 이용하여 글을 가르쳐 주겠다고 하였다. ≪문순태, 타오르는 강≫"], "285": ["이장(里長)이 뭐 대단한 벼슬이라고 【가드락대는】 꼴은 정말 못 봐 주겠다."], "286": ["구월산 일대에 화적 떼가 【발호하여】 일전에는 문화 고을이 기습당한 적이 있었습니다. ≪황석영, 장길산≫", "민치록의 딸을 고종의 비로 들여앉힌 이하응은 다시는 외척 세력이 【발호하지】 않을 것이라고 믿었다. ≪유현종, 들불≫"], "287": ["한 문장 안에 동사가 여러 개이거나 수식어가 필요 이상으로 많으면 【난삽한】 글이 된다.", "【난삽한】 문장.", "글이 【난삽하다】."], "288": ["구휼미로 빈민을 【구휼하다】.", "토호들은 흉년에 좁쌀로 장리 놀이를 하고 굶는 집 아이를 【구휼한다고】 데려가서는 평생 종으로 박아 버리기 예사이니…. ≪현기영, 변방에 우짖는 새≫"], "289": ["국내 은행에 외자를 【유치하다】.", "각국의 대사들은 올림픽 대회를 자국에 【유치하기】 위해 치열한 로비 활동을 벌였다.", "정부는 앞으로 공익사업에도 민간 자본을 적극 【유치하기로】 결정했다."], "290": ["기업 이미지를 【제고하다】.", "근로자의 근무 의욕을 【제고하기】 위한 방책을 강구하다.", "회사에서 생산성을 【제고하기】 위하여 여러 가지 아이디어를 모았다. ≪홍성원, 육이오≫"], "291": ["【화제를】 붙이다."], "292": ["【화제를】 다른 곳으로 돌리다.", "그의 무용담은 우리 사무실에서 【화제가】 되었다.", "정님이를 찾아간다는 것부터 창피한 일이거니와 그보다도 정님이와의 관계는 좋거니 나쁘거니 도시 【화제에】 올리고 싶지 않았다. ≪한설야, 황혼≫", "【화제의】 인물."], "295": ["노국 공주의 혼백을 향하여 비로소 두 번 절하고 한 잔 술을 부어 올리니 【유명은】 아주 다르고 저승과 이생은 영영히 갈려졌다. ≪박종화, 다정불심≫"], "296": ["【떼꾼한】 눈."], "297": ["그것은 방 가운데 놓인 질화로의 【밍근한】 잿불 기척만이나 하다 할까. 그래도 이만한 온기가 있어…. ≪최명희, 혼불≫"], "298": ["【낙낙한】 삶을 누리다.", "더도 덜도 없이 【낙낙하게】 살며 구들장 더워 오듯 따스우면…. ≪한수산, 유민≫"], "299": ["이렇게 【수고로운】 일을 부탁하여 미안하네.", "대웅전 하나만을 보기 위하여 수덕사를 열 번 찾아온다 해도 그 【수고로움이】 아깝지 않다.", "마음을 【수고롭게】 하는 사람은 남을 다스리고 몸을 【수고롭게】 하는 사람은 남에게 다스림을 받는다. ≪이문열, 황제를 위하여≫"], "300": ["일이 【수나롭게】 풀리다.", "누구 말이던가, 머리를 쓰면 쓸수록 【수나롭게】 돌아간다더니만 상배는 비로소 그 말을 실감했다. ≪이문구, 장한몽≫", "무얼 해야만 하기도 【수나롭고】 이문도 박하잖고 두루 괜찮을꼬? ≪채만식, 탁류≫"], "301": ["아내의 잠든 모습을 들여다보고 있는 그의 시야에 영산강의 【잔조로운】 물너울이 꽃잎처럼 너울거리며 겹쳐 왔다. ≪문순태, 타오르는 강≫"], "302": ["이번 기술 제휴는 우리 회사를 키우는 데 【종요로운】 일이므로 모두가 성심으로 이 일에 임해 주기 바랍니다."], "303": ["무슨 일에나 세심한 신경을 가졌던 홍 여사로서 그런 것에 【허수로울】 리가 만무하다. ≪황순원, 움직이는 성≫", "어머니에게는 그렇게 【허수롭게】 대답하는 것이 불리할 듯해서…. ≪주요섭, 미완성≫"], "304": ["공장들은 귀속 업체로 정부에 소유권이 넘어가고 【유휴】 상태가 한동안 계속되었다. ≪김원일, 불의 제전≫", "【유휴】 시설.", "【유휴】 병력.", "【유휴】 장비."], "305": ["이번 조치는 금융 시장의 【경색을】 초래했다.", "부정 선거 시비로 여야 관계의 【경색이】 예상된다.", "정국 【경색을】 풀다."], "306": ["국회가 열리고 오 개월이 지나도록 농지 개혁 실시는커녕 농지 개혁법조차 【상정이】 안 되고 있는 형편이었다. ≪조정래, 태백산맥≫"], "307": ["사무 자동화로 인건비의 【경감을】 꾀한다.", "도시 노동자의 생활비 【경감을】 위한 농산물 저가 정책을 실시한다.", "세금의 【경감】.", "형기의 【경감】."], "308": ["“이마에 땀을 흘리지 않는 자는 식탁에 앉을 수 없다.”라는 【경구는】 명심할 만하다."], "309": ["딸을 【살갑게】 대하다.", "형이라고 해도 【살가운】 정을 느끼기보다는 믿음직스러우면서도 어려웠다. ≪조정래, 태백산맥≫"], "310": ["그들은 무거운 짐들을 지고 종일 【나부댄】 탓인지 몹시 피곤했다.", "둑을 기어오르듯 날고 있던 흰 나비 한 마리가 보리 위로 옮겨 가서 몹시 【나부댄다】. ≪박경리, 시장과 전장≫"], "311": ["그 독살스러운 사람들이 소작료를 그렇게 【몰강스럽게】 긁어 간단 말이야. ≪한승원, 해일≫", "우리의 환경이 너무도 【몰강스러운】 살풍경이어서, 사람의 마음이 바서지도록 메마르지 않을 수 없으니…. ≪이희승, 먹추의 말참견≫"], "312": ["그는 행동이 몹시 【산망스러웠다】."], "313": ["차도 행인도 없는 네거리에서 신호등이 외롭게 【명멸하고】 있었다. ≪이동하, 도시의 늪≫", "네온이 【명멸하는】 거리의 확성기에서 노랫소리가 들려오고 있었다. ≪최인호, 지구인≫"], "314": ["그는 상대방의 정당하지 못한 행동을 【신랄하게】 비꼬았다.", "교수님의 【신랄한】 평가를 들은 학생은 결국 눈물을 보였다.", "상욱의 글은 그가 직접 조 원장을 만나고 있었을 때보다도 그 어조가 훨씬 더 【신랄하고】 분명했다. ≪이청준, 당신들의 천국≫", "【신랄한】 비판."], "315": ["그는 얼굴에 뉘우치는 기색이 【역력했다】.", "집 안에 도둑이 든 흔적이 【역력하다】.", "머릿속에 지나간 날들에 대한 기억이 【역력하게】 떠오른다.", "그녀의 얼굴에는 피로의 빛이 【역력했다】."], "316": ["그를 【위시하여】 여러 사람이 그 일에 참여했다.", "황제는 대답 대신, 우발산과 변약유를 【위시한】 자기 사람들을 불러 모았다. ≪이문열, 황제를 위하여≫"], "317": ["학생들에게 애국 사상을 【고취하다】.", "시민들의 인권 의식을 【고취하다】.", "신문과 잡지가 붓이 닳도록 향학열을 【고취하고】…. ≪채만식, 레디메이드 인생≫", "반일적이고 민족정기를 【고취하는】 내용이라고 못 쓰게 한다니 아니 통탄할 일이냐. ≪박완서, 미망≫"], "318": ["【조기를】 게양하다.", "【조기를】 달다."], "319": ["【조기】 체조.", "【조기】 청소.", "【조기】 축구."], "324": ["내가 그렇게 행동했다면 아버지께 【득달같은】 불호령을 받았을 것이다."], "325": ["요즈음은 하루하루 물가가 오르는 것이 【다락같아】 살 수가 없다."], "326": ["자식을 생각하는 부모 마음은 모두 【하나같다】."], "327": ["할머니는 살뜰하게 살림을 꾸리시는 분인데, 【무쪽같은】 나는 어떻게 살림을 해야 할지 몰라 공연히 허둥대기만 한다."], "328": ["며칠을 굶었더니 밥 생각이 【굴뚝같다】.", "마음은 【굴뚝같지만】 몸이 말을 듣지 않는다."], "329": ["체체하고 【습습하고】 상냥하고 원 그런 계집이 천하에 있겠느냐. ≪한무숙, 이사종의 아내≫"], "330": ["먹을 것이 【푼푼하다】.", "팔십 전을 손에 쥔 김 첨지의 마음은 【푼푼하였다】. ≪현진건, 운수 좋은 날≫", "농민군에 나오지 않은 사람들은 부조들이 【푼푼했다】. ≪송기숙, 녹두 장군≫"], "331": ["더구나 병일을 구슬리는 데는 그리 힘들지 않았다. 제 정실부인이 되어 달라고 오복조림을 하며, 명화의 청구라면 【헙헙하게】 들어주었다. ≪현진건, 적도≫"], "332": ["어머니는 암탉 중에서도 【실팍져】 보이는 놈으로 골라 할아버지께 대접하셨다.", "“예전 대접이라 두툼하니 【실팍지게도】 생겼다.” 안경잡이가 무슨 감여가나 되듯 대접을 집어 들며 중얼거렸다. ≪이문구, 장한몽≫", "【실팍진】 다리."], "333": ["제 행동이 다소 버릇없고 【무람없더라도】 용서하십시오.", "구민식은 여느 때 자기 앞에서 거의 의식적으로 【무람없는】 짓을 함부로 해 보이곤 하는 정짝귀의 부은 입 모습을 건너다보면서 입을 열었다. ≪한승원, 해일≫"], "335": ["그에게는 과거도, 미래도 없었다. 침통과 우울과 【참담과】 공포가 있을 뿐이었다. ≪최서해, 큰물 진 뒤≫"], "336": ["지록위마! 이 술어는 누구나가 다 항상 명심하고 경계해야 할 【잠언이】 아닐까 한다. ≪정비석, 비석과 금강산의 대화≫", "지금도 그가 그것을 통해 터득한 몇 가지 삶의 지혜와 그것에 비유해 들려주던 【잠언에】 가까운 충고는 내 기억에 뚜렷이 남아 있다. ≪이문열, 이 황량한 역에서≫"], "337": ["그럼에도 불구하고 강압과 【전횡을】 통치 기능의 전부로 하던 권력의 사냥개들은 추호의 동요도 일으키지 않았다. ≪신상웅, 심야의 정담≫", "【전횡을】 일삼다.", "【전횡을】 휘두르다."], "338": ["탄소 배출량 【상쇄】 방안.", "비용 【상쇄】."], "339": ["힘든 작업을 겨우 마치고 나니 마음이 한결 【가든했다】."], "340": ["유모가 우는 아이를 【까부르며】 달랜다.", "실물결 잔이랑이 기다랗게 세워진 그 불기둥을 중간에서부터 도막도막 잘라 키질하듯이 연방 위아래로 【까부르고】 있었다. ≪윤흥길, 묵시의 바다≫"], "341": ["털이 【함함한】 강아지.", "숱이 좋고 긴 머리채를 【함함하게】 따 내리다가 수갑사 댕기를 질끈 물려 고를 내고 졸라맨 것이라든지…. ≪이기영, 봄≫"], "342": ["촉촉한 새벽 강바람을 맞은 돛이 퍼덕여 소리치며 【수수러졌다】. ≪문순태, 타오르는 강≫"], "343": ["【의뭉한】 속셈을 드러내다.", "여태 꿀 장수로 보였던 놈이 갑자기 소도둑놈같이 【의뭉하게】 보였다. ≪송기숙, 자랏골의 비가≫"], "344": ["종잡을 수 없이 투명하기만 한 귀 양의 미소가 비로소 내 앞에 엄연한 실체로서 【현현하였다고】 나는 직감한 것입니다. ≪손창섭, 미소≫"], "345": ["노학자가 자신의 저서를 꼼꼼히 검토하고 【보정하여】 개정판을 출간했다.", "사람은 책 읽기를 통해 자신을 살피고 마음가짐을 【보정한다】."], "346": ["하찮은 일에 【연연하지】 말고 지금 너의 직분에 충실해야지.", "더 이상 과거에 【연연하지】 말고 현실을 직시해라.", "옛 우리네 선비들은 세상의 부와 명예와 권력에 【연연하지】 않았다.", "벼슬에 【연연하다】."], "347": ["하긴 임진년 이전에는 이 고을도 수천 호 대읍으로서 앞뒤의 넓은 들에는 인가가 【총총했었다】 한다. ≪이기영, 고향≫"], "348": ["인격이 그리 뛰어나거나 학식이 【도저한】 인물은 못 되나 시국에 대하여서 불평을 품고 무슨 일이나 하여 보자는 결심은 있어 보였다. ≪김구, 백범일지≫", "학문이 【도저하다】.", "의술이 【도저하다】.", "정성이 【도저하다】."], "349": ["관계 【개선을】 위하여 노력하다.", "【개선】 방안을 알아보다.", "입시 제도 【개선】.", "유통 구조 【개선】."], "350": ["【개선】 장병.", "【개선】 부대.", "【개선】 행진."], "351": ["시 의원의 【개선을】 실시하다.", "임원 【개선】."], "352": ["나는 내 실수가 【열없어서】 얼굴이 붉어졌다.", "그는 하릴없이 앉아 있기가 【열없어서】 곁에 있던 잡지를 뒤적거리기 시작했다."], "353": ["주막 여주인은 별로 탐탁스럽지가 않다는 듯 【뜨악한】 얼굴로 천 서방 부녀를 가볍게 흘려 보았다. ≪문순태, 타오르는 강≫", "【뜨악한】 기분.", "【뜨악한】 표정.", "【뜨악한】 눈초리."], "354": ["요즘 들어 둘 사이가 다소 【버름하다】."], "355": ["병업이네 염소가 호젓하게 시래기를 【조잔거리고】 있는데…. ≪이문구, 산 너머 남촌≫"], "358": ["몇 달을 두고 그렇게 【오매불망을】 해야 한 번 꿈에 보이지 않던 그이가 그 자리에 쓱 나타나 보이는 것도 이상하고…. ≪염상섭, 택일하던 날≫"], "359": ["인간사는 【새옹지마이다】.", "【새옹지마라고】 다 볕 들 날도 오겠지. ≪김원일, 불의 제전≫"], "364": ["누구 한 사람 도와주는 사람이 없으니 실로 【고장난명이라】, 일을 하기가 너무 어려웠다."], "366": ["【마이동풍으로】 흘려듣다.", "그에게는 나의 충고가 【마이동풍이었다】.", "아닌 게 아니라 수차 그런 권고를 했는데 【마이동풍이니】 딱하지요. ≪박경리, 토지≫"], "367": ["오래 길들인 생활의 터전을 내준 걸 후회했다. 후회해 봤자 【만시지탄이었다】. ≪박완서, 오만과 몽상≫"], "370": ["이웃 나라가 침범을 당하니 【순망치한이】 될까 염려스럽다."], "371": ["【자중지란으로】 일을 망치다.", "돈이 좀 생기면 그것을 서로 먹으려고 눈이 붉어서 【자중지란을】 일으키니, 그것들을 데리고 무슨 일을 한단 말요. ≪한용운, 흑풍≫"], "372": ["무수한 여자 가운데의 하나를 골라서 아내로 한다는 것은 스스로를 그렇게 속박하겠다고 한 것이나 다를 바가 없으니 이를테면 【자승자박이다】. ≪이병주, 행복어 사전≫"], "373": ["【호사다마라고】 덕산댁은 복남이를 낳고 산후 조리가 잘못되었던지 얼마 후 중풍에 걸려 몸져눕고 말았다. ≪현기영, 변방에 우짖는 새≫"], "375": ["실업자가 늘고 있는 상황에서 소비 심리가 개선되기를 바라는 것은 【연목구어나】 마찬가지다."], "376": ["감독의 【진두지휘】 아래 작업이 진행되고 있다.", "권 도원수는 【진두지휘를】 하기 위하여 이튿날 곧 곤양으로 말을 달려 떠났다. ≪박종화, 임진왜란≫", "【진두지휘에】 나서다."], "377": ["【무소불위의】 권력을 행사하다.", "힘 있는 자가 힘없는 자에게 일방적으로 【무소불위의】 힘을 행하는 시대는 지나갔다."], "379": ["【일촉즉발의】 긴장감이 감돌다.", "그들은 거대한 불만과 불안에 사로잡혀 건드리면 폭발할 듯한 【일촉즉발의】 발광적인 상태에 놓여 있었다. ≪홍성원, 육이오≫", "【일촉즉발의】 상황.", "【일촉즉발의】 순간."], "380": ["만일 그 통에 유 선달 집도 상인들에게 인심을 잃고 토호질을 하는 양반이었다면 화를 입었을 것이 【명약관화였다】. ≪이기영, 봄≫"], "381": ["미리 말씀드릴 것은, 이것은 그들이 저지른 친일 행위의 단적인 예에 불과한 것이며, 【구우일모에】 지나지 않는다는 사실입니다. ≪최일남, 거룩한 응달≫"], "382": ["노파는 어머니의 부어오른 손목을 보더니 【대경실색을】 하면서 당장 장안의 용한 침쟁이들을 줄줄이 엮어 댔지만…. ≪박완서, 엄마의 말뚝≫"], "383": ["남이 싫어하는 줄도 모르고 【방약무인으로】 떠들어 댄다.", "본시부터 신경질적인 성격은 차츰 잔인하게 변하였으며 【방약무인의】 젊은이로 성장했다. ≪박경리, 토지≫", "적병들은 평양서 다 죽었던 기운이 다시 소생이 되어 【방약무인으로】 교만할 터이니…. ≪박종화, 임진왜란≫"], "386": ["논개는 【누란지위에】 처한 나라를 구하기 위해 왜장을 안고 진주 남강에 떨어져 죽었다."], "387": ["또 설사 그 사람도 너를 그렇게 생각한다기로 오늘날 우리 처지로서는 【화중지병이지】 무슨 소용 있겠니. ≪이기영, 신개지≫"], "388": ["【미사여구만】 늘어놓는다고 해서 좋은 글이 되는 건 아니다.", "그러나 세상엔 영리하고 유식한 허무주의자, 그럴듯한 궤변을 일삼는 기회주의자들이 뭐라고 【미사여구를】 나열해서 청년들을 현혹하는 경우가 있으니 그런 자들에게 말려들어선 안 돼. ≪이병주, 지리산≫"], "389": ["당장 소문이 인근 마을에 쫙 퍼져 일부러 구경 오는 사람들로 하루 종일 【문전성시를】 이루었다. ≪현기영, 변방에 우짖는 새≫"], "390": ["빈둥거리다가 대입에 실패한 형이 나에게는 좋은 【반면교사가】 되어 주었다.", "이번 사태를 【반면교사로】 삼아 이후에 닥쳐 올 다른 사태의 대응책을 미리 마련해야 한다."], "391": ["민족을 위해서 어떤 일이든 【견마지로를】 다하겠습니다. ≪최일남, 거룩한 응달≫"], "392": ["고대 희랍의 도시 국가인 아테네와 스파르타는 【견원지간이라】 전쟁이 끊이지 않았다.", "아무리 형제 사이가 【견원지간이라】 해도 혈육인 바에야 자기가 도와주지 않고 어쩔 것이냐…. ≪최일남, 거룩한 응달≫"], "393": ["지겨운 가난을 면하기 위해 【고육지책으로】 개가해 간 게 오히려 고생문으로 자청해 들어간 꼴이 되었다.", "정부는 가만히 놔뒀다가는 배춧값의 폭락이 뻔하기 때문에 농민들의 피해가 더 커지기 전에 공급량을 줄인다는 【고육지책을】 쓴 것이다.", "길상을 국내에 잡아 두기 위해 【고육지책으로】 오백 섬지기 땅을 내놓은 서희는…. ≪박경리, 토지≫"], "394": ["아군의 피해는 적군의 피해에 비하면 【조족지혈에】 불과했다."], "395": ["그동안 보살펴 주신 선생님의 은혜는 실로 【각골난망입니다】."], "396": ["남이 무어라고 한다 해서 쉽사리 【부화뇌동】, 주견도 없이 남의 의견을 따라 이리저리 흔들리는 것은 아예 처음부터 하지 않음만 못합니다. ≪최명희, 혼불≫", "괜한 허영이나 【부화뇌동으로】 이리저리 날뛰는 것도 아니고, 천방지축으로 노는 것도 아니에요. ≪최일남, 그때 말이 있었네≫"], "398": ["【종두득두라】 자네 말이 맞네. ≪박경수, 동토≫"], "399": ["티(T) 씨의 마음이 말 그대로의 액면이라면 고마운 마음이라고 아니 할 수 없었다. 그렇다고 해서 【양두구육이】 아니냐고 따져 볼 형편도 안 되는 것이었다. ≪이병주, 지리산≫"], "400": ["【사고무친의】 외로운 신세.", "고향이라곤 하지만 【사고무친이긴】 객지와 다를 바 없어 혼례를 치르러 처가에 갈 때 후행으로 따라가 줄 만한 먼 친척도 없다는 한탄과…. ≪박완서, 미망≫"], "402": ["설악산은 안으로 깊이 들어갈수록 그 멋이 【점입가경이다】.", "어떤 신분, 어떤 관계, 어떤 내막인지 알 수 없지만 뭔지 【점입가경의】 느낌도 없지 않아 갑자기 신이 난다. ≪박경리, 토지≫"], "403": ["【당랑거철도】 유분수지 그런 일에 덤벼들다니.", "두메 속에 사는 토박이 상놈들이 조 의정 집의 위력을 막을 수는 그야말로 【당랑거철이었다】. ≪이기영, 봄≫"], "404": ["어린 시절 뛰놀던 고향은 【상전벽해라는】 비유가 어울릴 만큼 큰 변화가 있었다.", "【상전벽해라더니】 그동안에 이렇게 변했나? ≪염상섭, 신정≫"], "405": ["절치부심에다 【와신상담을】 짬뽕해 가지고 언젠가는 내가 되로 받은 것을 상대방한테 말로 갚아 버릴 작정이지. ≪윤흥길, 꿈꾸는 자의 나성≫"], "408": ["그는 【적수공권으로】 외국에 나가 큰돈을 모았다.", "나리께서는 지금 몸에 고의적삼만 입으셨습니다.…칼도 아니 드신 【적수공권인】 빈주먹이십니다. ≪박종화, 임진왜란≫"], "410": ["역시 자네가 【지기지울세】. 우몽 자네를 보니 뭇 근심이 봄눈 녹듯 사그라지네. ≪김원일, 불의 제전≫", "【지기지우를】 사귀다."], "411": ["추야 장장 긴긴 밤을 【전전불매】 잠 못 들 제 상사일념 애타는 줄 그대는 아시는가. ≪김원일, 불의 제전≫"]};

// ---------- helpers ----------
const $ = id => document.getElementById(id);
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function split(a){const m=a.match(/^([^(]+)\(([^)]+)\)(.*)$/);return m?{w:m[1]+m[3],h:m[2]}:{w:a,h:""}}
function defHTML(q){return q.split("\n").map(p=>"<p>"+esc(p)+"</p>").join("")}
const ENTRIES = DATA.map((d,i)=>({id:i,tag:d[0],q:d[1],a:d[2],...split(d[2])}));
const TAGS = ["전체","고유어","한자어","한자성어"];

// merge same headword for flashcards
const CARDS = (()=>{const m=new Map();for(const e of ENTRIES){if(!m.has(e.a))m.set(e.a,{...e,qs:[e.q],ids:[e.id]});else{const c=m.get(e.a);if(!c.qs.includes(e.q))c.qs.push(e.q);c.ids.push(e.id)}}return [...m.values()]})();
$("count").textContent = `단어 ${CARDS.length}개 · 빈칸 문제 ${Object.keys(EX).length}문항`;

function chipRow(el, onPick){
  el.innerHTML = TAGS.map((t,i)=>`<button class="chip" data-t="${t}" aria-pressed="${i===0}">${t}</button>`).join("");
  el.addEventListener("click",e=>{const b=e.target.closest(".chip");if(!b)return;el.querySelectorAll(".chip").forEach(x=>x.setAttribute("aria-pressed",x===b));onPick(b.dataset.t)});
}

// ---------- tabs ----------
function setTab(t){
  $("tabFlip").setAttribute("aria-pressed",t==="flip");$("tabQuiz").setAttribute("aria-pressed",t==="quiz");
  $("flip").hidden = t!=="flip"; $("quiz").hidden = t!=="quiz";
  try{localStorage.setItem("kbs-tab",t)}catch(e){}
}
$("tabFlip").onclick=()=>setTab("flip");
$("tabQuiz").onclick=()=>setTab("quiz");

// ---------- flashcards ----------
const F={dir:"word",tag:"전체",queue:[],pos:0,total:0,know:0,again:0,flipped:false};
function fStart(){
  const pool = CARDS.filter(c=>F.tag==="전체"||c.tag===F.tag);
  F.queue = shuffle(pool); F.total = pool.length; F.pos=0; F.know=0; F.again=0; fRender();
}
function exampleFor(card){
  for(const id of shuffle(card.ids)){const ex=EX[id];if(ex&&ex.length){const s=ex[Math.floor(Math.random()*ex.length)];return esc(s.replace(/≪[^≫]*≫/g,"").trim()).replace(/【([^】]*)】/g,"<b>$1</b>")}}
  return "";
}
function fRender(){
  const c = F.queue[0];
  $("card").classList.remove("flipped"); F.flipped=false;
  $("fPos").textContent = Math.min(F.know+1,F.total); $("fTot").textContent=F.total;
  $("fKnow").textContent=F.know; $("fAgain").textContent=F.again;
  $("flipBar").style.width = (F.total?F.know/F.total*100:0)+"%";
  $("again").disabled=$("know").disabled=!c;
  if(!c){
    $("front").innerHTML=`<div class="main"><div class="word">끝!</div><div class="def">${F.total}개 카드를 모두 외웠어요. "다시" ${F.again}번.</div><button class="btn primary" id="fRe" style="margin-top:12px">새로 섞어서 다시</button></div>`;
    $("back").innerHTML=""; $("fRe").onclick=e=>{e.stopPropagation();fStart()}; return;
  }
  const wordSide = `<div class="main"><div class="word">${esc(c.w)}</div>${c.h?`<div class="hanja">${esc(c.h)}</div>`:""}</div>`;
  const defSide = `<div class="main"><div class="def">${c.qs.map(defHTML).join('<p style="color:var(--muted)">·</p>')}</div></div>`;
  const ex = exampleFor(c);
  const top = s=>`<div class="top"><span class="tag">${c.tag}</span><span class="side">${s}</span></div>`;
  if(F.dir==="word"){
    $("front").innerHTML = top("단어")+wordSide+`<p class="hint">눌러서 뜻 보기</p>`;
    $("back").innerHTML = top("뜻")+`<div class="main"><div class="word" style="font-size:22px">${esc(c.w)}${c.h?` <span class="hanja">${esc(c.h)}</span>`:""}</div><div class="def">${c.qs.map(defHTML).join("")}</div></div>`+(ex?`<div class="ex">${ex}</div>`:"");
  }else{
    $("front").innerHTML = top("뜻")+defSide+`<p class="hint">눌러서 단어 보기</p>`;
    $("back").innerHTML = top("단어")+wordSide+(ex?`<div class="ex">${ex}</div>`:"");
  }
  sizeCard();
}
function sizeCard(){
  const f=$("front"),b=$("back");
  [f,b].forEach(x=>{x.style.position="relative";});
  const h=Math.max(300,f.scrollHeight,b.scrollHeight);
  [f,b].forEach(x=>{x.style.position="";});
  $("card").style.minHeight=h+"px";
}
function flip(){ if(!F.queue[0])return; F.flipped=!F.flipped; $("card").classList.toggle("flipped",F.flipped); }
$("card").addEventListener("click",flip);
$("card").addEventListener("keydown",e=>{if(e.key===" "||e.key==="Enter"){e.preventDefault();flip()}});
$("know").onclick=()=>{F.queue.shift();F.know++;fRender()};
$("again").onclick=()=>{const c=F.queue.shift();F.again++;const at=Math.min(F.queue.length,3+Math.floor(Math.random()*Math.max(1,F.queue.length-3)));F.queue.splice(at,0,c);fRender()};
$("reshuffle").onclick=fStart;
$("dirWord").onclick=()=>{F.dir="word";$("dirWord").setAttribute("aria-pressed",true);$("dirDef").setAttribute("aria-pressed",false);fRender()};
$("dirDef").onclick=()=>{F.dir="def";$("dirDef").setAttribute("aria-pressed",true);$("dirWord").setAttribute("aria-pressed",false);fRender()};
chipRow($("tagRow"),t=>{F.tag=t;fStart()});
window.addEventListener("resize",()=>{if(F.queue[0])sizeCard()});

// ---------- blank quiz ----------
// words that mean (nearly) the same thing are never offered as each other's wrong options
const SAME = [["조우하다","봉우하다","상봉하다","조봉하다","해후하다"],["누란지세","누란지위"],["고육지계","고육지책"],["문정약시","문전성시"],["갑절","곱절"],["연연","연연하다"],["습습하다","헙헙하다","푼푼하다","걱실걱실하다"],["열없다","맥쩍다","머쓱하다","점직하다"],["살갑다","곰살궂다","삽삽하다","곰상스럽다"],["내숭스럽다","의뭉하다"],["매욱스럽다","덩둘하다"],["몰강스럽다","모지락스럽다"],["수령","영수"],["전수"],["게염","게염스럽다"],["가살","가살스럽다","간살스럽다"],["저간","목하"],["가없이","가뭇없이"]];
const grp = w => SAME.findIndex(g=>g.includes(w));
const isPred = w => /다$/.test(w);
const QPOOL = ENTRIES.filter(e=>EX[e.id]&&EX[e.id].length);
const Q={tag:"전체",list:[],i:0,ok:0,bad:0};

function distractors(e){
  const g = grp(e.w);
  const bad = o => o.a===e.a || o.w===e.w&&!e.h || (g>=0&&grp(o.w)===g) || o.q===e.q;
  const homo = shuffle(ENTRIES.filter(o=>o.w===e.w&&o.a!==e.a&&o.q!==e.q&&!(g>=0&&e.w==="전수")));
  const same = shuffle(ENTRIES.filter(o=>!bad(o)&&o.tag===e.tag&&isPred(o.w)===isPred(e.w)&&o.w!==e.w));
  const rest = shuffle(ENTRIES.filter(o=>!bad(o)&&o.w!==e.w));
  const out=[],seen=new Set([e.a]);
  for(const o of [...homo.slice(0,2),...same,...rest]){ if(seen.has(o.a)||out.some(x=>x.w===o.w&&!o.h))continue; seen.add(o.a); out.push(o); if(out.length===4)break; }
  return out;
}
function qStart(){
  Q.list = shuffle(QPOOL.filter(e=>Q.tag==="전체"||e.tag===Q.tag)).map(e=>{
    const ex = EX[e.id]; const s = ex[Math.floor(Math.random()*ex.length)];
    return {e, s, opts: shuffle([e,...distractors(e)])};
  });
  Q.i=0;Q.ok=0;Q.bad=0;qRender();
}
function sentenceHTML(s,e,state){
  const src = (s.match(/≪([^≫]*)≫/)||[])[1]||"";
  let body = s.replace(/\s*≪[^≫]*≫/,"").trim();
  body = esc(body).replace(/【([^】]*)】/g,(m,tok)=>{
    let shown="", rest="";
    if(!isPred(e.w) && tok.startsWith(e.w)){ rest = tok.slice(e.w.length); }
    if(state) shown = rest? e.w : tok;
    const cls = state? (state==="ok"?"blank ok":"blank bad") : "blank";
    return `<span class="${cls}">${state?esc(shown):"&nbsp;"}</span>${esc(rest)}`;
  });
  return {body, src};
}
function qRender(){
  const n=Q.list.length;
  $("qTot").textContent=n; $("qOk").textContent=Q.ok; $("qBad").textContent=Q.bad;
  $("qPos").textContent=Math.min(Q.i+1,n); $("quizBar").style.width=(n?Q.i/n*100:0)+"%";
  const it=Q.list[Q.i];
  if(!it){
    $("qBox").innerHTML=`<div class="q done"><div class="label">결과</div><div class="big">${Q.ok} / ${n}</div><p class="stem">정답률 ${n?Math.round(Q.ok/n*100):0}%</p><button class="btn primary" id="qAgain">새로 섞어서 다시 풀기</button></div>`;
    $("qAgain").onclick=qStart; return;
  }
  const {body,src}=sentenceHTML(it.s,it.e,null);
  const nums="①②③④⑤";
  $("qBox").innerHTML=`<div class="q">
    <div class="stem">다음 문장의 빈칸에 들어갈 말로 가장 알맞은 것은? <span style="white-space:nowrap">(기본형으로 제시)</span></div>
    <div class="sent">${body}</div>
    <div class="src">표준국어대사전 용례${src?` · ≪${esc(src)}≫`:""}</div>
    <ol class="opts">${it.opts.map((o,k)=>`<li><button class="opt" data-k="${k}"><span class="n">${nums[k]}</span><span>${esc(o.w)}${o.h?`<span class="h">(${esc(o.h)})</span>`:""}</span></button></li>`).join("")}</ol>
    <div id="qExp"></div>
  </div>`;
  $("qBox").querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(+b.dataset.k));
}
function answer(k){
  const it=Q.list[Q.i]; if(it.done)return; it.done=true;
  const pick=it.opts[k], right=pick===it.e;
  right?Q.ok++:Q.bad++;
  const btns=$("qBox").querySelectorAll(".opt");
  btns.forEach((b,j)=>{b.disabled=true;if(it.opts[j]===it.e)b.classList.add("ok");else if(j===k)b.classList.add("bad")});
  const {body}=sentenceHTML(it.s,it.e,right?"ok":"bad");
  $("qBox").querySelector(".sent").innerHTML=body;
  const e=it.e;
  $("qExp").innerHTML=`<div class="explain">
    <div class="verdict ${right?"ok":"bad"}">${right?"정답입니다.":"오답입니다. 정답은 "+nums(it)+"번."}</div>
    <div class="w">${esc(e.w)}${e.h?` <span class="hanja" style="font-size:14px">${esc(e.h)}</span>`:""}</div>
    <div>${defHTML(e.q)}</div>
    ${right?"":`<div class="stem" style="margin-top:4px">고른 답 · ${esc(pick.w)}${pick.h?"("+esc(pick.h)+")":""}: ${esc(pick.q.replace(/\n/g," "))}</div>`}
  </div>
  <button class="btn primary" id="qNext" style="width:100%;margin-top:12px">${Q.i+1<Q.list.length?"다음 문제":"결과 보기"}</button>`;
  $("qOk").textContent=Q.ok;$("qBad").textContent=Q.bad;
  $("qNext").onclick=()=>{Q.i++;qRender();window.scrollTo({top:0,behavior:"smooth"})};
  $("qNext").focus({preventScroll:true});
}
function nums(it){return "①②③④⑤"[it.opts.indexOf(it.e)]}
$("qRestart").onclick=qStart;
chipRow($("qTagRow"),t=>{Q.tag=t;qStart()});

// ---------- boot ----------
fStart(); qStart();
let saved="flip"; try{saved=localStorage.getItem("kbs-tab")||"flip"}catch(e){}
setTab(saved==="quiz"?"quiz":"flip");
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{if(F.queue[0])sizeCard()});
</script>
